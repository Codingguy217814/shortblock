name: Build ShortBlock
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          mkdir -p proj/.
          cat > proj/settings.gradle.kts <<'EOF_SB'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ShortBlock"
          include(":app")
          EOF_SB
          mkdir -p proj/.
          cat > proj/build.gradle.kts <<'EOF_SB'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_SB
          mkdir -p proj/.
          cat > proj/gradle.properties <<'EOF_SB'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_SB
          mkdir -p proj/app
          cat > proj/app/build.gradle.kts <<'EOF_SB'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          val verCode = (project.findProperty("verCode") as String?)?.toInt() ?: 1
          android {
              namespace = "com.shortblock"
              compileSdk = 34
              signingConfigs {
                  create("rel") {
                      storeFile = rootProject.file("release.p12")
                      storePassword = "shortblock"
                      keyAlias = "sb"
                      keyPassword = "shortblock"
                      storeType = "pkcs12"
                  }
              }
              defaultConfig {
                  applicationId = "com.shortblock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = verCode
                  versionName = "1.$verCode"
              }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("rel") } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_SB
          mkdir -p proj/app/src/main
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF_SB'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="https"/>
                  </intent>
              </queries>
              <application android:label="ShortBlock" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".InstallReceiver" android:exported="false"/>
                  <service android:name=".BlockerService"
                      android:exported="true"
                      android:label="ShortBlock"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF_SB
          mkdir -p proj/app/src/main/res/xml
          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF_SB'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewSelected"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="250"
              android:description="@string/desc"/>
          EOF_SB
          mkdir -p proj/app/src/main/res/values
          cat > proj/app/src/main/res/values/strings.xml <<'EOF_SB'
          <resources>
              <string name="desc">Leaves Reels, Explore and Spotlight screens automatically.</string>
          </resources>
          EOF_SB
          mkdir -p proj/app/src/main/java/com/shortblock
          cat > proj/app/src/main/java/com/shortblock/BlockerService.kt <<'EOF_SB'
          package com.shortblock

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Rect
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class BlockerService : AccessibilityService() {
              private var last = 0L

              private var browsers: Set<String> = setOf(
                  "com.android.chrome", "com.sec.android.app.sbrowser", "org.mozilla.firefox",
                  "com.brave.browser", "com.microsoft.emmx", "com.opera.browser", "com.duckduckgo.mobile.android"
              )

              private val loop = object : Runnable {
                  override fun run() {
                      Updater.check(applicationContext)
                      Handler(Looper.getMainLooper()).postDelayed(this, 6 * 60 * 60 * 1000L)
                  }
              }

              override fun onServiceConnected() {
                  Handler(Looper.getMainLooper()).postDelayed(loop, 15000)
                  try {
                      val i = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_BROWSER)
                      browsers = browsers + packageManager.queryIntentActivities(i, PackageManager.MATCH_ALL).map { it.activityInfo.packageName }
                  } catch (_: Exception) {}
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  val pkg = e?.packageName?.toString() ?: return
                  if (pkg != "com.instagram.android" && pkg != "com.snapchat.android" && pkg != "com.google.android.youtube" && pkg !in browsers) return
                  val p = getSharedPreferences("prefs", Context.MODE_PRIVATE)
                  if (!p.getBoolean("enabled", true)) return
                  val now = System.currentTimeMillis()
                  if (now - last < 700) return
                  val root = rootInActiveWindow ?: return
                  val hit = try {
                      when {
                          pkg == "com.instagram.android" -> instagram(root, p)
                          pkg == "com.snapchat.android" -> snapchat(root, p)
                          pkg == "com.google.android.youtube" -> youtube(root, p)
                          pkg in browsers -> browser(root, pkg, p)
                          else -> false
                      }
                  } catch (_: Exception) { false }
                  if (hit) last = now
              }

              override fun onInterrupt() {}

              private fun instagram(root: AccessibilityNodeInfo, p: SharedPreferences): Boolean {
                  fun sel(id: String) = root.findAccessibilityNodeInfosByViewId("com.instagram.android:id/$id").any { it.isSelected }
                  fun selLabel(vararg names: String) = find(root, 0) { n -> n.isSelected && names.any { label(n).startsWith(it, true) } } != null
                  val reels = p.getBoolean("ig_reels", true) && (sel("clips_tab") || selLabel("Reels"))
                  val explore = p.getBoolean("ig_explore", true) && (sel("search_tab") || selLabel("Search and explore"))
                  if (!reels && !explore) return false
                  val home = root.findAccessibilityNodeInfosByViewId("com.instagram.android:id/feed_tab").firstOrNull()
                  if (home == null || !click(home)) performGlobalAction(GLOBAL_ACTION_BACK)
                  return true
              }

              private fun snapchat(root: AccessibilityNodeInfo, p: SharedPreferences): Boolean {
                  val h = resources.displayMetrics.heightPixels
                  val spot = p.getBoolean("snap_spotlight", true) && find(root, 0) { n ->
                      label(n).equals("Spotlight", true) && (n.isSelected || n.isChecked || run {
                          val r = Rect(); n.getBoundsInScreen(r); r.top < h * 0.25 && r.bottom > 0
                      })
                  } != null
                  val disc = p.getBoolean("snap_discover", true) && find(root, 0) { n ->
                      label(n).equals("Discover", true) && n.isVisibleToUser
                  } != null
                  if (!spot && !disc) return false
                  performGlobalAction(GLOBAL_ACTION_BACK)
                  return true
              }

              private fun youtube(root: AccessibilityNodeInfo, p: SharedPreferences): Boolean {
                  if (!p.getBoolean("yt_shorts", true)) return false
                  val inShorts = root.findAccessibilityNodeInfosByViewId("com.google.android.youtube:id/reel_player_page_container").isNotEmpty() ||
                      find(root, 0) { n -> n.isSelected && label(n).equals("Shorts", true) } != null
                  if (!inShorts) return false
                  performGlobalAction(GLOBAL_ACTION_BACK)
                  return true
              }

              private fun browser(root: AccessibilityNodeInfo, pkg: String, p: SharedPreferences): Boolean {
                  val h = resources.displayMetrics.heightPixels
                  val urls = ArrayList<String>()
                  collect(root, 0, h, urls)
                  for (url in urls) {
                      val bad = (p.getBoolean("web_reels", true) && url.contains("instagram.com/reel")) ||
                          (p.getBoolean("web_explore", true) && url.contains("instagram.com/explore")) ||
                          (p.getBoolean("web_spotlight", true) && url.contains("snapchat.com/spotlight")) ||
                          (p.getBoolean("web_all_ig", true) && url.contains("instagram.com")) ||
                          (p.getBoolean("web_other", true) && (url.contains("youtube.com/shorts") || url.contains("tiktok.com") || url.contains("facebook.com/reel")))
                      if (bad) { performGlobalAction(GLOBAL_ACTION_BACK); return true }
                  }
                  return false
              }

              private fun collect(n: AccessibilityNodeInfo?, depth: Int, h: Int, out: MutableList<String>) {
                  if (n == null || depth > 25) return
                  val t = (n.text ?: n.contentDescription ?: "").toString().lowercase()
                  if (t.length in 5..300 && (t.contains("instagram.com") || t.contains("snapchat.com") || t.contains("youtube.com") || t.contains("tiktok.com") || t.contains("facebook.com"))) {
                      val r = Rect(); n.getBoundsInScreen(r)
                      if (r.top < h * 0.3) out.add(t)
                  }
                  for (i in 0 until n.childCount) collect(n.getChild(i), depth + 1, h, out)
              }

              private fun label(n: AccessibilityNodeInfo) = (n.contentDescription ?: n.text ?: "").toString()

              private fun find(n: AccessibilityNodeInfo?, depth: Int, pred: (AccessibilityNodeInfo) -> Boolean): AccessibilityNodeInfo? {
                  if (n == null || depth > 25) return null
                  if (pred(n)) return n
                  for (i in 0 until n.childCount) find(n.getChild(i), depth + 1, pred)?.let { return it }
                  return null
              }

              private fun click(n: AccessibilityNodeInfo): Boolean {
                  var c: AccessibilityNodeInfo? = n
                  while (c != null) {
                      if (c.isClickable && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      c = c.parent
                  }
                  return false
              }
          }
          EOF_SB
          mkdir -p proj/app/src/main/java/com/shortblock
          cat > proj/app/src/main/java/com/shortblock/MainActivity.kt <<'EOF_SB'
          package com.shortblock

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.ViewGroup
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var upd: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val prefs = getSharedPreferences("prefs", Context.MODE_PRIVATE)
                  val d = resources.displayMetrics.density
                  val pad = (20 * d).toInt()
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }

                  col.addView(TextView(this).apply { text = "ShortBlock"; textSize = 28f })
                  status = TextView(this).apply { textSize = 15f; setPadding(0, pad / 2, 0, pad / 2) }
                  col.addView(status)
                  col.addView(Button(this).apply {
                      text = "Open Accessibility Settings"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  val items = listOf(
                      "enabled" to "Master switch",
                      "ig_reels" to "Instagram Reels (app)",
                      "ig_explore" to "Instagram Explore (app)",
                      "snap_spotlight" to "Snapchat Spotlight (app)",
                      "snap_discover" to "Snapchat Discover (app)",
                      "web_reels" to "Instagram Reels (browser)",
                      "web_explore" to "Instagram Explore (browser)",
                      "web_spotlight" to "Snapchat Spotlight (browser)",
                      "web_all_ig" to "Block ALL Instagram in browser",
                      "web_other" to "YouTube Shorts / TikTok / Facebook Reels (browser)",
                      "yt_shorts" to "YouTube Shorts (app)"
                  )
                  for ((key, name) in items) {
                      col.addView(Switch(this).apply {
                          text = name; textSize = 17f
                          isChecked = prefs.getBoolean(key, true)
                          setPadding(0, pad / 2, 0, pad / 2)
                          setOnCheckedChangeListener { _, v -> prefs.edit().putBoolean(key, v).apply() }
                      }, ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  col.addView(TextView(this).apply { text = "Checking for updates..."; textSize = 14f; setPadding(0, pad, 0, 0); upd = this })
                  col.addView(Button(this).apply {
                      text = "Allow auto-update"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))) }
                  })
                  Updater.check(this) { upd.text = it }
                  setContentView(ScrollView(this).apply { addView(col) })
              }

              override fun onResume() {
                  super.onResume()
                  if (::upd.isInitialized && packageManager.canRequestPackageInstalls()) Updater.check(this) { upd.text = it }
                  val on = (Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: "")
                      .contains(packageName)
                  status.text = if (on) "Status: ON and blocking" else "Status: OFF. Turn on ShortBlock in Accessibility > Installed apps."
              }
          }
          EOF_SB
          mkdir -p proj/app/src/main/java/com/shortblock
          cat > proj/app/src/main/java/com/shortblock/Updater.kt <<'EOF_SB'
          package com.shortblock

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageInstaller
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Updater {
              const val REPO = "REPO_PLACEHOLDER"
              private val main = Handler(Looper.getMainLooper())

              @Suppress("DEPRECATION")
              fun check(ctx: Context, status: (String) -> Unit = {}) {
                  val app = ctx.applicationContext
                  Thread {
                      try {
                          val c = URL("https://api.github.com/repos/$REPO/releases/latest").openConnection() as HttpURLConnection
                          c.setRequestProperty("Accept", "application/vnd.github+json")
                          c.connectTimeout = 10000; c.readTimeout = 10000
                          val j = JSONObject(c.inputStream.bufferedReader().readText())
                          val latest = j.getString("tag_name").removePrefix("v").toInt()
                          val cur = app.packageManager.getPackageInfo(app.packageName, 0).versionCode
                          if (latest > cur) {
                              if (!app.packageManager.canRequestPackageInstalls()) {
                                  main.post { status("Update $latest ready. Tap 'Allow auto-update' below.") }
                                  return@Thread
                              }
                              main.post { status("Installing update (build $latest)...") }
                              install(app, j.getJSONArray("assets").getJSONObject(0).getString("browser_download_url"))
                          } else main.post { status("Up to date (build $cur)") }
                      } catch (e: Exception) {
                          main.post { status("Update check failed (repo must be public)") }
                      }
                  }.start()
              }

              private fun install(ctx: Context, url: String) {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 15000; conn.readTimeout = 60000
                  val pi = ctx.packageManager.packageInstaller
                  val params = PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL)
                  if (Build.VERSION.SDK_INT >= 31) params.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED)
                  val id = pi.createSession(params)
                  val s = pi.openSession(id)
                  conn.inputStream.use { inp -> s.openWrite("update.apk", 0, -1).use { out -> inp.copyTo(out); s.fsync(out) } }
                  val pend = PendingIntent.getBroadcast(ctx, id, Intent(ctx, InstallReceiver::class.java).setPackage(ctx.packageName), PendingIntent.FLAG_MUTABLE)
                  s.commit(pend.intentSender)
                  s.close()
              }
          }

          class InstallReceiver : BroadcastReceiver() {
              @Suppress("DEPRECATION")
              override fun onReceive(c: Context, i: Intent) {
                  if (i.getIntExtra(PackageInstaller.EXTRA_STATUS, -1) == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      val conf = i.getParcelableExtra<Intent>(Intent.EXTRA_INTENT) ?: return
                      conf.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      c.startActivity(conf)
                  }
              }
          }
          EOF_SB
          echo '' | base64 -d > proj/release.p12
          sed -i "s#REPO_PLACEHOLDER#${{ github.repository }}#" proj/app/src/main/java/com/shortblock/Updater.kt
      - name: Build
        run: cd proj && gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk ShortBlock.apk
          gh release create "v${{ github.run_number }}" ShortBlock.apk --repo "${{ github.repository }}" --title "ShortBlock build ${{ github.run_number }}" --notes "Install ShortBlock.apk"
